name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashea
          POSTGRES_PASSWORD: cashea
          POSTGRES_DB: cashea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashea -d cashea_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: cashea
      PGPASSWORD: cashea
      PGDATABASE: cashea_test
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp .env.test.example .env.test
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - run: npm run build
