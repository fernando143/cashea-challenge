<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cashea installment checkout</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #17202a; background: #f5f7fa; }
      body { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
      main { background: white; border-radius: .75rem; padding: 1.5rem; box-shadow: 0 4px 18px #17202a18; }
      form { display: grid; gap: .75rem; margin: 1rem 0; }
      label { display: grid; gap: .25rem; font-weight: 600; }
      input, select, button { font: inherit; padding: .6rem; border: 1px solid #b8c2cc; border-radius: .35rem; }
      button { cursor: pointer; background: #1261a0; color: white; border: 0; }
      button:disabled { cursor: wait; opacity: .6; }
      [hidden] { display: none !important; }
      .error { color: #a02626; min-height: 1.5rem; }
      .success { color: #176b38; }
      .plan { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      .plan th, .plan td { text-align: left; padding: .4rem; border-bottom: 1px solid #e5e7eb; }
      .muted { color: #5d6873; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cashea checkout</h1>
      <output id="status" class="muted">Log in to view your credit line.</output>
      <a id="created-purchase-link" href="#purchase-details" hidden>View purchase</a>
      <p id="error" class="error" role="alert"></p>

      <form id="login-form">
        <label>Email <input id="email" type="email" autocomplete="username" required value="demo@cashea.local" /></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Log in</button>
      </form>

      <section id="checkout" hidden>
        <h2>Credit line</h2>
        <p>Available: <strong id="available">—</strong></p>
        <p>Limit: <strong id="limit">—</strong></p>
        <button id="logout-button" type="button">Log out</button>

        <section aria-labelledby="purchase-lookup-title">
          <h2 id="purchase-lookup-title">View purchase</h2>
          <form id="purchase-lookup-form">
            <label>Purchase ID <input id="purchase-id" type="text" autocomplete="off" required /></label>
            <button id="purchase-lookup-button" type="submit">View purchase</button>
          </form>

          <section id="purchase-details" hidden>
            <h3>Purchase details</h3>
            <p>ID: <strong id="purchase-detail-id"></strong></p>
            <p>Amount: <strong id="purchase-detail-amount"></strong></p>
            <p>Status: <strong id="purchase-detail-status"></strong></p>
            <p>Created at: <strong id="purchase-detail-created-at"></strong></p>
            <p>Payment method: <strong id="purchase-detail-payment-method"></strong></p>
            <table class="plan">
              <thead><tr><th>#</th><th>Amount</th><th>Due date</th><th>Status</th><th>Paid at</th><th>Action</th></tr></thead>
              <tbody id="purchase-plan-rows"></tbody>
            </table>
          </section>
        </section>

        <form id="purchase-form">
          <label>Amount (cents) <input id="amount" type="number" min="3" max="99999999" step="1" required /></label>
          <label>Installments
            <select id="installments">
              <option value="3">3</option>
              <option value="6">6</option>
              <option value="12">12</option>
            </select>
          </label>
          <button id="preview-button" type="submit">Preview plan</button>
        </form>

        <section id="preview" hidden>
          <h2>Preview</h2>
          <table class="plan">
            <thead><tr><th>#</th><th>Amount</th><th>Due date</th></tr></thead>
            <tbody id="plan-rows"></tbody>
          </table>
          <button id="confirm-button" type="button">Confirm purchase</button>
        </section>
      </section>
    </main>
    <script type="module" src="/main.mjs"></script>
  </body>
</html>
