<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cashea installment checkout</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #17202a; background: #f5f7fa; }
      body { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
      main { background: white; border-radius: .75rem; padding: 1.5rem; box-shadow: 0 4px 18px #17202a18; }
      form { display: grid; gap: .75rem; margin: 1rem 0; }
      label { display: grid; gap: .25rem; font-weight: 600; }
      input, select, button { font: inherit; padding: .6rem; border: 1px solid #b8c2cc; border-radius: .35rem; }
      button { cursor: pointer; background: #1261a0; color: white; border: 0; }
      button:disabled { cursor: wait; opacity: .6; }
      [hidden] { display: none !important; }
      .error { color: #a02626; min-height: 1.5rem; }
      .success { color: #176b38; }
      .plan { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      .plan th, .plan td { text-align: left; padding: .4rem; border-bottom: 1px solid #e5e7eb; }
      .muted { color: #5d6873; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cashea checkout</h1>
      <p id="status" class="muted" role="status">Log in to view your credit line.</p>
      <p id="error" class="error" role="alert"></p>

      <form id="login-form">
        <label>Email <input id="email" type="email" autocomplete="username" required value="demo@cashea.local" /></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Log in</button>
      </form>

      <section id="checkout" hidden>
        <h2>Credit line</h2>
        <p>Available: <strong id="available">—</strong> cents</p>
        <p>Limit: <strong id="limit">—</strong> cents</p>

        <form id="purchase-form">
          <label>Amount (cents) <input id="amount" type="number" min="3" step="1" required /></label>
          <label>Installments
            <select id="installments">
              <option value="3">3</option>
              <option value="6">6</option>
              <option value="12">12</option>
            </select>
          </label>
          <button id="preview-button" type="submit">Preview plan</button>
        </form>

        <section id="preview" hidden>
          <h2>Preview</h2>
          <table class="plan">
            <thead><tr><th>#</th><th>Amount (cents)</th><th>Due date</th></tr></thead>
            <tbody id="plan-rows"></tbody>
          </table>
          <button id="confirm-button" type="button">Confirm purchase</button>
        </section>
      </section>
    </main>
    <script>
      const state = { token: null, preview: null };
      const $ = (id) => document.getElementById(id);
      const error = (message = "") => { $("error").textContent = message; };
      const busy = (button, value) => { button.disabled = value; $("status").textContent = value ? "Loading…" : ""; };
      async function request(url, options = {}) {
        const response = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}), ...(options.headers || {}) } });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || "Request failed");
        return body;
      }
      async function refreshCredit() {
        const credit = await request("/credit-line");
        $("available").textContent = credit.available;
        $("limit").textContent = credit.creditLimit;
      }
      $("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector("button");
        error(); busy(button, true);
        try {
          const body = await request("/login", { method: "POST", body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
          state.token = body.token;
          $("checkout").hidden = false;
          $("status").textContent = "Ready to simulate a purchase.";
          await refreshCredit();
        } catch (cause) { error(cause.message); }
        finally { busy(button, false); }
      });
      $("purchase-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = $("preview-button");
        error(); busy(button, true); $("preview").hidden = true;
        try {
          const body = await request("/purchases/preview", { method: "POST", body: JSON.stringify({ amount: Number($("amount").value), installments: Number($("installments").value) }) });
          state.preview = body;
          $("plan-rows").innerHTML = body.plan.map((item) => `<tr><td>${item.number}</td><td>${item.amount}</td><td>${item.dueDate}</td></tr>`).join("");
          $("preview").hidden = false;
        } catch (cause) { error(cause.message); }
        finally { busy(button, false); }
      });
      $("confirm-button").addEventListener("click", async () => {
        if (!state.preview) return;
        const button = $("confirm-button");
        error(); busy(button, true);
        try {
          await request("/purchases", { method: "POST", headers: { "Idempotency-Key": crypto.randomUUID() }, body: JSON.stringify({ amount: state.preview.amount, installments: state.preview.installments }) });
          await refreshCredit();
          $("status").textContent = "Purchase confirmed. Your balance was refreshed.";
          $("preview").hidden = true; state.preview = null;
        } catch (cause) { error(cause.message.includes("Insufficient") ? "Insufficient available credit." : cause.message); }
        finally { busy(button, false); }
      });
    </script>
  </body>
</html>
