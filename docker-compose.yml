services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:?PGUSER must be set in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
      POSTGRES_DB: ${PGDATABASE:?PGDATABASE must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - cashea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cashea

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - cashea

  app:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cashea

volumes:
  cashea_pgdata:

networks:
  cashea:
